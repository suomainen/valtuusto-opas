{n:43,title:'Laillisuus ja päätösvaltaisuus',short:'Kokouksen laillisuus',tag:'Menettely',facts:['Kokouskutsu on esittelyn mukaan julkaistu ja lähetetty 6.11.2026. Päätösvaltaisuus edellyttää vähintään 24 valtuutettua.','Puheenjohtaja toteaa laillisuuden ja päätösvaltaisuuden. Erillisiä liitteitä ei ole.'],assessment:'Tavanomainen menettelyasia ilman itsenäistä talousvaikutusta. Asianmukainen kutsu ja päätösvaltaisuus ovat kaikkien myöhempien päätösten edellytyksiä.',risks:['Hyväksyttävän liitekokonaisuuden pitää olla sama ja yksiselitteinen kaikille valtuutetuille.'],questions:['Onko kaikille toimitettu lopullinen hyväksyttävä liitekokonaisuus, myös salassa pidettävät osat?'],sources:[]},
{n:44,title:'Sähköisen pöytäkirjan tarkastajat',short:'Pöytäkirjan tarkastajat',tag:'Menettely',facts:['Tarkastajiksi ehdotetaan Sami Lehtoa ja Mikko Lindbergiä. Tarkastus tehdään sähköisesti viimeistään päivää ennen nähtäville asettamista.','Asiakohdassa nähtävillepanoksi kuvataan seuraavan viikon tiistai, mutta kokouksen etusivulla ilmoitetaan maanantai 16.11.2026.'],assessment:'Nähtävilläolo ja tarkastamisen määräaika on yhdenmukaistettava. Kyse on tiedoksiannon selkeydestä, ei merkittävästä talousratkaisusta.',risks:['Päivämäärä on ristiriitainen: 16. vai 17.11.2026.'],questions:['Milloin pöytäkirja asetetaan nähtäville ja mikä on tarkastajien määräaika?'],sources:[['Kokouksen perustiedot',meeting]]},
{n:45,title:'Talousarvio 2027 ja taloussuunnitelma 2028–2029',short:'Talousarvio 2027',tag:'Talous',critical:true,facts:['Kaupunginhallitus käsitteli kirjan 29.10. ilman muutoksia ja hyväksyi 4.11. esityksen valtuustolle. Nyt päätetään määrärahoista, tuloarvioista, tavoitteista ja rahoituksesta.','Vuoden 2027 vuosikate on 3 038 715 euroa ja alijäämä 767 285 euroa. Nettoinvestoinnit ovat 878 000 euroa. Rahoituslaskelman velan vähennys on 2,187 miljoonaa euroa.','Lautakuntien esityksiin tehty parannus on 928 475 euroa. Noin 540 000 euroa siitä tulee Kevan tasausmaksuarvion alenemisesta, valtionosuusarvion korotuksesta ja Lämpökeskuksen osinkotuoton lisäyksestä.','Suunnittelukauden ulkopuoliset hanketarpeet ovat karkeasti 25,905 miljoonaa euroa, joista siirrettyä talonrakentamista 14,4 miljoonaa. Ne eivät ole nyt myönnettäviä määrärahoja.'],assessment:'Suunta paranee, mutta pysyvä tasapaino on herkkä. Vuosikate kattaa laskelmani mukaan noin 78 % poistoista. Velan väheneminen perustuu suurelta osin investointitaukoon. Noin 58 % kaupunginjohtajakäsittelyn tulosparannuksesta on edellä mainittuja ennuste- ja rahoituseriä, joten koko summaa ei voi pitää pysyvänä toiminnan tehostumisena.',risks:['Verotulojen ja työllisyysmenojen ennusteet ovat herkkiä. Vuoden 2029 noin 5 000 euron ylijäämä jättää hyvin vähän liikkumavaraa.','Investointien lykkäys voi olla järkevää tilaverkkoselvitystä odotettaessa, mutta voi kasvattaa korjausvelkaa, väistötilatarvetta ja turvallisuusriskejä.','Talousarvio ennakoi erillisiä palveluverkkoratkaisuja, muun muassa Preitilän päiväkodin toiminnan päättymistä 1.8.2027.','Konserniriskit eivät näy kaupungin velkaluvussa: Yrityskiinteistöillä on yksi vuokralainen ja noin 6 % omavaraisuustavoite; Palvelukeskussäätiön tavoite vuodelle 2027 on 1,38 %. Lämpökeskuksella ja Vesihuollolla on investointitarpeita.'],questions:['Mikä osa sopeutuksesta on pysyvää säästöä, mikä ennustemuutosta ja mikä palvelutason laskua?','Mikä on vuoden 2027 tulos, jos verotulot jäävät prosentin ennusteesta tai työttömyys ei alene?','Miten kuuden koulunkäynninohjaajan ja lukion erityisopetuksen vähennykset suhteutuvat todettuun tuen tarpeeseen?','Mitkä säästöt edellyttävät erillisiä palveluverkko-, henkilöstö- tai maksuperustepäätöksiä?','Mitkä siirretyt korjaukset ovat kiireellisiä, ja milloin tilaverkkoratkaisut tulevat päätettäviksi?','Miten Lämpökeskuksen lisäosinko sovitetaan sen investointi- ja varautumistarpeisiin?','Saadaanko ennen hyväksymistä yhtenäiset talouslaskelmat ja laskelma kertyneen ylijäämän kehityksestä?'],sources:[['Talousarviokirja · 112 s.',budget],['Kaupunginjohtajakäsittelyn muistio · 8 s.',memo],['Kuntalaki 110 §',laws]],extra:'budget'},
{n:46,title:'Vuoden 2027 tuloveroprosentti',short:'Tulovero 8,20 %',tag:'Verotus',facts:['Ehdotus on 8,20 %, sama kuin vuonna 2026. Kunnallisverotilityksiksi arvioidaan noin 24 miljoonaa euroa. Erillisiä liitteitä ei ole.','Talousarviokirjan mukaan 0,10 prosenttiyksikön korotus tuottaisi ensimmäisenä vuonna noin 270 000 euroa.'],assessment:'Verotuksen vakauden vastapainona ovat alijäämä ja palveluvähennykset. Korotuksen tuottoarvio antaa vaihtoehdoille mittakaavan; se ei itsessään ole suositus korotuksesta.',risks:['Veropohjan kasvu on ennuste. Palkkasumman, työllisyyden ja väestön oletukset ratkaisevat kertymän.','Ilmoitusaika päättyy 17.11.2026. Esittelyn viikonpäivä on virheellinen: päivä on tiistai.'],questions:['Onko vertailtu veron ennallaan pitämisen, pienen korotuksen ja palvelusäästöjen vaikutuksia?','Mihin palkkasumma-, työllisyys- ja väestöoletuksiin noin 24 miljoonan euron kertymä perustuu?'],sources:[['Verotuottojen herkkyys · s. 89',budget],['Verotusmenettelylain 91 a §','https://www.finlex.fi/fi/lainsaadanto/1995/1558']]},
{n:47,title:'Vuoden 2027 kiinteistöveroprosentit',short:'Kiinteistöverot',tag:'Verotus',facts:['Prosentit säilyvät ehdotuksessa ennallaan. Yleishyödyllisille yhteisöille ei vahvisteta erillistä prosenttia; se ei tarkoita yleistä verovapautusta.','Ilmoitus Verohallinnolle on tehtävä 17.11.2026 mennessä.'],assessment:'Sama prosentti ei takaa yksittäisen kiinteistön veron pysymistä samana, sillä myös verotusarvo ja rekisteritiedot vaikuttavat maksuun.',risks:['Vuoden 2026 kiinteistöverotuotto alittaa budjetin. Syyt ja vaikutus vuoden 2027 ennusteeseen on selvitettävä.'],questions:['Mistä vuoden 2026 verotuoton alitus johtuu ja miten se näkyy vuoden 2027 arviossa?','Mikä olisi yleishyödyllisten yhteisöjen alemman prosentin kustannus ja kohdentuminen?','Onko rakentamattomien tonttien rekisteri ajan tasalla?'],sources:[['Verotuottojen arviot · s. 89–91',budget]],extra:'tax'},
{n:48,title:'Turun työllisyysalueen yhteistoimintasopimus',short:'Työllisyysalueen yhteistyö',tag:'Sopimus',critical:true,facts:['Päivitetty sopimus esitetään hyväksyttäväksi voimaan 1.1.2027. Turku säilyy vastuukuntana.','Lautakunnassa on 13 jäsentä: Turku valitsee kuusi, muut kuntaryhmät seitsemän. Paimio kuuluu Kaarinan, Liedon ja Sauvon ryhmään, jolla on kaksi varsinaista paikkaa.','Toteutuneet nettokustannukset jaetaan kunnille. Maksuosuuksiin sisältyvät myös yhteistoiminnan investointien poistot ja rahoituskulut. Laskutus neljännesvuosittain, tasaus seuraavan helmikuun loppuun mennessä.'],assessment:'Paimio kantaa rahoitusvastuuta kokonaisuudesta, jonka yksittäisiin menoihin sillä on rajallinen päätösvalta. Talousarviomuutoksista päättää Turun valtuusto. Häiriötilanteissa sitoudutaan Turun hallintosäännön toimivaltajärjestelyihin.',risks:['Paimion euromääräistä muutosvaikutusta ei ole julkaistussa liitteessä.','Kumottavan sopimuksen viittaus on tarkistettava: päätösehdotuksessa 13.11.2024 § 59, taustatekstissä yhteistoimintasopimus 27.9.2023 § 62.','Sopimuksen voimaantulo on sidottu kaikkien osapuolten allekirjoituksiin. Päätösehdotuksen 1.1.2027-aikataulu on varmistettava.'],questions:['Mikä on Paimion vuoden 2027 maksuosuus euroina ja muutos vanhaan sopimukseen?','Miten Paimio pääsee vaikuttamaan kustannuksia kasvattaviin muutoksiin ennen hyväksymistä?','Mitä Turun häiriötilannetoimivalta merkitsee Paimion henkilöstölle ja lähipalveluille?','Mikä aiempi päätös ja sopimus tällä täsmällisesti korvataan?'],sources:[['Yhteistoimintasopimus · 13 s.',pdf('2026768-6-43307')]]},
{n:49,title:'Viranomaistehtävien sopimus ja kahdeksan liitettä',short:'Työllisyyden viranomaistehtävät',tag:'Sopimus',critical:true,facts:['Uusi sopimus esitetään hyväksyttäväksi liitteineen 1.1.2027 alkaen. Paimio jatkaa lähipalvelujen tuottamista itselleen ja Sauvolle.','Toimivalta annetaan määritellyille viranhaltijoille virkavastuulla. Paikallinen henkilöstö-, ICT- ja tietosuojavastuu säilyy.','Maksuosuudet alkavat päivittyä vuosittain jo vuonna 2027, aiemmin tarkoitetun kiinteiden osuuksien käytön sijaan.'],assessment:'Kustannustenjakomallin muutos on taloudellisesti olennainen. Hyväksymisen tueksi tarvitaan Paimion vaikutuslaskelma. Oma tuotanto ei pääsopimuksen mukaan poista velvollisuutta osallistua yhteishankintaan, joten Apilan uravalmennuksen todellinen säästö on tarkistettava.',risks:['Lopulliset maksuosuudet luvataan vasta ennen ensimmäistä laskutusta, mikä vaikeuttaa ennakointia.','Liitteen 2 prosessikaavioon on jäänyt viittaus ”liitteeseen X”.','Arkaluonteisten tietojen käsittely vaatii käytännön valmiuden ilmoittaa loukkausepäilystä 24 tunnissa.','Voimaantulo on pääsopimuksessa sidottu kunkin osapuolen allekirjoitukseen; aikataulu ja delegoinnit pitää sovittaa yhteen.'],questions:['Paljonko vuosittainen päivitys muuttaa Paimion ja Paimio–Sauvo-alueen osuuksia vuonna 2027?','Milloin lopulliset osuudet saadaan budjetointia varten?','Vähentääkö oma uravalmennus Paimion laskua ja kuinka paljon yhteishankintavelvoitteiden jälkeen?','Ovatko virkasuhteet ja delegointipäätökset ajan tasalla?','Kuka antaa starttirahan kotikuntalausunnot ja miten yhdenvertainen käytäntö varmistetaan?','Miten allekirjoituksiin sidottu voimaantulo ja 1.1.2027 tavoite sovitetaan yhteen?'],sources:[['Pääsopimus · 32 s.',pdf('2026768-7-43308')]],extra:'attachments'},
{n:50,title:'Tilikunta Oy:n osakkeiden myynti',short:'Tilikunnan osakekauppa',tag:'Omistus',critical:true,facts:['Paimio myy 19 osakettaan (14,62 %) Kuntalaskenta Oy:lle osana koko osakekannan kauppaa. Kaupunginjohtaja valtuutetaan allekirjoittamaan ja tekemään vähäisiä tarkennuksia.','Julkisessa kauppakirjassa kiinteä hinta on koko osakekannasta 500 000 euroa ja lisähinta enintään 250 000 euroa. Lisähinnan ehdot on peitetty.','Omistusosuuden mukainen laskelmani Paimion kiinteästä osuudesta on noin 73 077 euroa ja mahdollisesta lisähinnasta enintään 36 538 euroa. Lopullinen tilitys vaatii laskentaliitteen.','Yhtiön kuntalainaa on yhteensä 182 395,58 euroa. Takaisinmaksusta ja mahdollisesta kauppahinta-oikaisusta on erilliset ehdot. Talous- ja palkkahallinnon palvelut on tarkoitus kilpailuttaa.'],assessment:'Kertaluonteinen myyntitulo on pieni suhteessa palvelujen jatkuviin kustannuksiin. Arvioinnissa painavat siksi tuleva palveluhinta, palvelujen jatkuvuus ja sopimusvastuut. Paimion oma omistus ylittää uuden 10 % rajan, vaikka kuuden pienemmän omistajan osuus alittaa sen. Järjestelytarve ei yksin osoita tämän kaupan olevan paras vaihtoehto.',risks:['Julkinen kauppakirja on peitetty osittain ja sen viisi alaliitettä puuttuvat. Täydellistä vastuu- ja lisähinta-arviota ei voi tehdä.','Kilpailukielto on viisi vuotta ja rekrytointikielto neljä vuotta; rekrytointikieltoon sisältyy poikkeus oma-aloitteiselle hakemiselle julkiseen tehtävään.','Myyjän enimmäisvastuu on pääsäännön mukaan saatu kauppahinta; tahallisuus ja törkeä huolimattomuus on rajattu erikseen. Riidat ratkaistaan välimiesmenettelyssä.','Kauppakirja tunnistaa yhtiökokousasiakirjojen puutteita, joiden selvittämisessä ja korjaamisessa myyjät sitoutuvat avustamaan.','Hankintalain omistusvaatimuksen pääsääntöinen soveltaminen alkaa 1.7.2027. Kaupan ja kilpailutetun sopimuksen välinen siirtymä on järjestettävä.'],questions:['Mikä on Paimion nettotuotto lainasaamisten, kulujen ja oikaisujen jälkeen?','Mihin riippumattomaan arvonmääritykseen hinta perustuu ja mitä muita vaihtoehtoja vertailtiin?','Millä ehdoilla ja hankintaoikeudellisella perusteella palvelu jatkuu kilpailutettuun sopimukseen asti?','Rajoittavatko kilpailu- ja rekrytointikiellot oman toiminnan järjestämistä myöhemmin?','Onko henkilöstön jatkuvuudesta sitova takuu vai kaupalle asetettu tavoite?','Onko kaikilla valtuutetuilla täydellinen sopimus alaliitteineen ja selvitys myyjän vastuista?'],sources:[['Julkinen kauppakirja · 13 s.',pdf('2026768-8-43325')],['Hankintalain muutos 519/2026','https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2026/519']]},
{n:51,title:'Kiinteistökuntayhtymän tilintarkastaja',short:'Kuntayhtymän tilintarkastus',tag:'Hallinto',critical:true,facts:['BDO Audiator Oy esitetään valittavaksi tilikauden 2026 tarkastajaksi ja tarkastuslautakunnan sihteeritehtävään. Päätöstä pyydetään 20.11. mennessä.','Kuntayhtymän purkamista ja kiinteistöjen tulevaisuutta selvitetään.'],assessment:'Valinta turvaa hallinnon jatkuvuutta. Purkuvalmistelu korostaa kiinteistöjen arvostuksen, vuokrasopimusten ja vastuiden tarkastamista.',risks:['Mainittu tilintarkastussopimusluonnos puuttuu julkisesta asiakohdasta ja tarkistetusta kaupunginhallituksen 29.10. § 195:n asiakohdasta. Hintaa ja työn laajuutta ei voi varmistaa.','Valinta koskee vain vuotta 2026, vaikka esittely kuvaa hallintosäännön lähtökohdaksi valtuustokautta vastaavan ajan.'],questions:['Mikä on tarkastuksen ja sihteerityön hinta sekä lisätyön hinnoittelu?','Miksi valinta tehdään vain vuodelle 2026?','Miten tilintarkastajan riippumattomuus ja sihteeritehtävän rajaus turvataan?','Milloin Paimio saa laskelman mahdollisen purkamisen varoista, veloista ja vastuista?'],sources:[['Hallituksen aiempi käsittely',base+'cgi/DREQUEST.PHP?id=2026765-7&page=meetingitem']]},
{n:52,title:'Vuoden 2026 talousarvion muutokset',short:'Talousarvion 2026 muutokset',tag:'Talous',critical:true,facts:['Liitteen mukaan muutokset heikentävät tulosta yhteensä 100 300 euroa. Investointimenot kasvavat nettona 320 000 euroa.','Kriivarin lisämäärärahaa perustellaan osin menojen siirtymisellä tilikaudelta 2025 vuodelle 2026. Putkiurakoitsijan konkurssiin liittyviä mahdollisia saatavia ei ole ennakoitu.'],assessment:'Verotulojen paraneminen ei kata kaikkia heikennyksiä. Investointilisäys kasvattaa rahoitustarvetta, mutta ei ole sellaisenaan samansuuruinen tulosvaikutus. Kriivarin kokonaiskustannusta pitää tarkastella yli tilikausirajojen.',risks:['Esittelytekstissä kiinteistöveron vähennys on 182 000 euroa, hyväksyttävässä liitteessä 185 000 euroa. Liitteen luku vastaa muutosta 2,7 miljoonasta 2,515 miljoonaan euroon.','Konkurssisaatavat, korjausvastuut ja hankkeen lopulliset kustannukset ovat selvitettäviä.'],questions:['Mikä on Kriivarin kokonaiskustannus verrattuna alkuperäiseen ja viimeiseen hyväksyttyyn kokonaisbudjettiin?','Mikä osa lisämäärärahasta on jaksotusta ja mikä kustannusylitystä?','Mikä on konkurssisaatavien ja korjausvastuiden tilanne?','Mikä on vuoden 2026 uusi tulos- ja velkaennuste kaikkien muutosten jälkeen?'],sources:[['Talousarviomuutokset · 1 s.',pdf('2026768-10-43330')]],extra:'changes'},
{n:53,title:'Hyvinvointisuunnitelma 2026–2030',short:'Hyvinvointisuunnitelma',tag:'Hyvinvointi',critical:true,facts:['Hyväksyttäväksi esitetään 20-sivuinen suunnitelma, joka kattaa myös lasten ja nuorten sekä ikääntyneiden hyvinvointisuunnittelun.','Painopisteet ovat liikkuminen ja hyvinvointi, osallisuus, turvallinen ja viihtyisä ympäristö sekä elinvoima. Vastuutahoja ja mittareita on osoitettu.','Tavoitteena ovat muun muassa PaHaMan ja liikuntaneuvonnan vakiinnuttaminen, koulunuorisotyö, kirjaston kohtaava työ ja palveluaikojen pidentäminen sekä saavutettavat palvelut.'],assessment:'Suunta tukee ennaltaehkäisevää työtä. Toimeenpano jää kuitenkin monin paikoin nykyisten resurssien varaan ilman euromääriä, työpanoksia, määräaikoja tai määrällisiä tavoitetasoja.',risks:['Kirjaston palveluaikoja halutaan pidentää samalla, kun henkilöstö vähenee.','Koulunuorisotyö halutaan vakiinnuttaa, mutta vuoden 2027 jälkeinen rahoitus ratkaistaan vasta vuoden 2028 talousarviossa.','Liikkumisympäristöjä halutaan kehittää ylläpidon työpanoksen vähentyessä. Palvelumaksujen korotukset voivat heikentää osallistumista.','Taustana käytetty laaja hyvinvointikertomus ei ole tämän kokouksen liitteenä. Sen koko tilanneanalyysi ei ole tarkistettavissa tästä aineistosta.'],questions:['Mitkä ovat vuoden 2027 kolme tärkeintä toimenpidettä, niiden kustannukset ja vastuuhenkilöt?','Mitkä ovat keskeisten mittarien lähtöarvot ja vuoden 2030 tavoitetasot?','Milloin toteutumisesta raportoidaan valtuustolle?','Miten pienituloisten, vammaisten ja paljon tukea tarvitsevien osallistuminen turvataan?','Miten lasten ja ikääntyneiden suunnitelmien lakisääteisten sisältövaatimusten täyttyminen on tarkistettu?'],sources:[['Hyvinvointisuunnitelma · 20 s.',pdf('2026768-11-43331')],['Talousarvion palveluresurssit',budget]]},
{n:54,title:'Talousarvion toteuma tammi–syyskuu 2026',short:'Talousraportti 1–9/2026',tag:'Seuranta',critical:true,facts:['Esitys on merkitä raportti tiedoksi. Vuosikate on 2,814 miljoonaa euroa ja ylijäämä 161 039 euroa. Verotulot ovat 20,493 miljoonaa ja valtionosuudet 8,304 miljoonaa euroa.','Ulkoiset toimintakulut ovat kasvaneet 1,6 % ja verotulot 8,3 % vuoden takaiseen verrattuna.','Lainaa on 71,2 miljoonaa euroa, 2,6 miljoonaa enemmän kuin vuodenvaihteessa. Asukkaita on 11 256, vähennystä 22.','Valmistelijan alle miljoonan euron vuotuinen alijäämäarvio on ehdollinen: menojen, tuottojen ja verokehityksen on toteuduttava suotuisasti.'],assessment:'Kehitys on edellisvuotta parempi, mutta syyskuun pieni ylijäämä ei ole koko vuoden ennuste. Ulkoiset toimintatuotot ovat laskeneet noin 340 000 euroa, vaikka sisäiset ja ulkoiset tuotot yhteensä kasvavat.',risks:['Loppuvuoden palkat, jaksotukset ja verotilitykset voivat muuttaa tulosta merkittävästi. Vuonna 2025 loppuvuosi heikensi tilannetta.','Esittelyssä valtionosuudet ovat vajaat 8,1 miljoonaa euroa, taulukossa 8,304 miljoonaa. Kiinteistöveron laskuksi tekstissä ilmoitetaan 4,6 %, taulukosta noin 3,6 %.','Kassavarat on esitetty heinäkuulta, muut luvut syyskuulta.','Yhteisöverokaaviossa kaksi selitettä on vuodelle 2025. Verolajien yhteiskaavion vuoden 2025 ja TA2026 luvut eivät vastaa yksityiskohtaista taulukkoa.'],questions:['Mikä on päivitetty koko vuoden ennuste tuloksesta, kassasta ja velasta?','Sisältääkö ennuste § 52:n muutokset, avustusten jaksotukset ja kaikki tiedossa olevat loppuvuoden menot?','Saadaanko korjattu ja keskenään yhtenäinen talousraportti sekä syyskuun kassatilanne?'],sources:[['Tuloslaskelma · 1 s.',pdf('2026768-12-43037')],['Verotilitysten pylväät · 1 s.',pdf('2026768-12-43038')],['Verolajit ja kuukausikertymät · 2 s.',pdf('2026768-12-43039')],['Verotaulukko ja ennusteet · 1 s.',pdf('2026768-12-43040')]]},
{n:55,title:'Mahdolliset kiireelliset asiat',short:'Kiireelliset asiat',tag:'Menettely',facts:['Esityslistassa ei yksilöidä kiireellisiä asioita eikä julkaista liitteitä. Sisältöä tai vaikutuksia ei voi ennakoida.'],assessment:'Kiireellisyyden peruste on kirjattava. Kuntalain 95 §:n mukaan valmistelemattoman, kutsussa mainitsemattoman kiireellisen asian ottaminen käsittelyyn vaatii yksimielisyyden; tämä ei välttämättä koske sisältöratkaisua.',risks:['Uutta sitoumusta ei pidä hyväksyä ilman riittävää tietoa vaikutuksista ja toimivallasta.'],questions:['Miksi ratkaisua ei voida siirtää seuraavaan asianmukaisesti valmisteltuun kokoukseen?'],sources:[['Kuntalaki 95 §',laws]]},
{n:56,title:'Valtuutettujen kirjalliset aloitteet',short:'Kirjalliset aloitteet',tag:'Aloitteet',facts:['Aloitteita ei ole ennakolta yksilöity eikä julkaistu liitteitä. Talous- ja oikeusvaikutuksia ei voi vielä arvioida.'],assessment:'Aloitteen jättäminen ei itsessään hyväksy ehdotettua palvelua tai määrärahaa. Valmistelulle kannattaa pyytää vastuutaho ja tavoiteaika.',risks:[],questions:['Kenelle aloitteet annetaan valmisteltaviksi ja missä aikataulussa niihin vastataan?'],sources:[]}
];
const attachments=[
['Liite 1 · Lähipalvelut','2026768-7-43309','Työnvälitys, suunnitelmat, asiakasprosessit, ohjaus ja yrityspalvelut. Riittävät henkilöstö- ja osaamisresurssit on varmistettava.'],
['Liite 2 · Talousarviomenettely','2026768-7-43310','Budjetoinnin aikataulu ja kesken vuoden lisättävät palvelut. Lisäpalvelu voi synnyttää lisälaskun. Prosessikaavion ”liite X” on korjattava.'],

, "sources": [["Talousarviokirja · verotuottojen herkkyys s. 89", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43306.PDF"], ["Kaupunginjohtajakäsittelyn muistio", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43305.PDF"]]}, {"status": "Osittainen vastaus", "text": "Talousarviokirjan mukaan Vistan koulun kuuden koulunkäynninohjaajan vähennys (säästö 93 600 €) on mahdollinen, koska erityisopettajien määrää on nostettu. Lukion erityisopetus vähenee puoleen erityisopettajaan (säästö noin 25 000 €). Arviota tuen tarpeen kehityksestä tai oppilaskohtaisista vaikutuksista ei löytynyt.", "sources": [["Talousarviokirja · perusopetus ja lukio", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43306.PDF"]]}, {"status": "Osittainen vastaus", "text": "Talousarviokirjan mukaan Preitilän päiväkodin mahdollisesta lakkauttamisesta tehdään erillinen päätös (määrärahat 31.7.2027 asti). Kaupunki tilasi FCG:ltä palveluverkkoselvityksen, joka valmistui elokuussa 2026; sitä täydennetään vuonna 2027 tilaverkkoselvityksellä ennen ratkaisuja. Kattavaa luetteloa erillisiä päätöksiä vaativista säästöistä ei löytynyt.", "sources": [["Talousarviokirja · koulutuslautakunta", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43306.PDF"]]}, {"status": "Osittainen vastaus", "text": "Kaupunginjohtajan muistion mukaan korjauksia, kuten yläkoulun teknisen työn purunpoistoa, tehdään väliaikaisesti, kunnes tilaverkkoselvityksen perusteella on tehty päätökset. Tilaverkkoselvitys tehdään vuoden 2027 aikana; tarkkaa päätösaikataulua tai kiireellisyysarviota ei löytynyt. Siirretyt hankkeet ovat Investoinnit-välilehdellä.", "sources": [["Kaupunginjohtajakäsittelyn muistio", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43305.PDF"], ["Talousarviokirja · investointiosa s. 99", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43306.PDF"]]}, {"status": "Osittainen vastaus", "text": "Paimion Lämpökeskus investoi parhaillaan lämpöpumppulaitokseen ja sähkökattilaan (toimittaja Calefa), jotka otetaan käyttöön keväällä 2027. Yhtiöllä on siis ajankohtainen investointitarve. Lisäosingon suuruutta suhteessa yhtiön rahoitukseen ei löytynyt julkisista lähteistä.", "sources": [["Calefa / STT-tiedote 21.5.2026", "https://www.sttinfo.fi/tiedote/72061705/paimion-lampokeskus-investoi-sahkoistettyyn-lammontuotantoon-calefa-toimittaa-lampopumppu-ja-sahkokattilaratkaisun"]]}, {"status": "Ei löytynyt", "text": "Esityksen mukaan kertynyttä ylijäämää oli vuoden 2025 lopussa 13,7 milj. euroa. Laskelmaa sen kehityksestä vuosina 2026–2029 ei löytynyt julkisesta aineistosta.", "sources": [["Kuntalaki 110 §", "https://www.finlex.fi/fi/lainsaadanto/2015/410"]]}], "46": [{"status": "Osittainen vastaus", "text": "Talousarviokirjassa on laskelma veronkorotusten tuotosta (0,10 %-yks. noin 270 000 €, 0,20 %-yks. 540 000 €, 0,50 %-yks. 1,35 milj. € ensimmäisenä vuonna). Kirjan mukaan veronkorotusten tarve arvioidaan, jos muut talouden tervehdyttämistoimet eivät riitä. Vaihtoehtojen rinnakkaista vaikutusvertailua palvelusäästöihin ei löytynyt.", "sources": [["Talousarviokirja · verotulot s. 89", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43306.PDF"]]}, {"status": "Osittainen vastaus", "text": "Kirjan mukaan vuoden 2026 verotilitysten arvioidaan olevan noin 23,0 milj. € (+6,7 %) ja vuoden 2027 noin 24,0 milj. € (+4,5 %); vuosille 2028–2029 arvioidaan 3,6–4,0 %:n kasvua. Kunnat laativat arvionsa yleensä Kuntaliiton veroennustekehikolla, jonka kevään 2026 versio arvioi työllisyyden kääntyvän maltilliseen kasvuun vasta seuraavana vuonna. Paimion tarkkoja palkkasumma- ja väestöoletuksia ei löytynyt.", "sources": [["Talousarviokirja · verotulot", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43306.PDF"], ["Kuntaliiton veroennustekehikko 4.5.2026", "https://www.kuntaliitto.fi/sites/default/files/media/file/Kuntaliiton%20veroennustekehikko_04052026.pdf"]]}], "47": [{"status": "Osittainen vastaus", "text": "Valtakunnallisesti rakennusten verotusarvot laskivat sekä 2025 että 2026, ja Verohallinnon mukaan kiinteistöveron tuotto kasvaa vuonna 2026 vain noin 1 %; valtaosassa kunnista tuotto laskee tai pysyy ennallaan. Kuntaliitto kuvaa vuotta 2026 kiinteistöveron osalta historiallisen heikoksi. Paimiokohtaista syyerittelyä ei löytynyt.", "sources": [["Verohallinto: ennakkotietoa kiinteistöverotuksesta 2026", "https://vero.fi/tietoa-verohallinnosta/tilastot/kiinteistoverotilastoj/ennakkotietoa-kiinteistoverotuksesta-2026/"], ["Kuntaliiton veroennustekehikko 4.5.2026", "https://www.kuntaliitto.fi/sites/default/files/media/file/Kuntaliiton%20veroennustekehikko_04052026.pdf"]]}, {"status": "Osittainen vastaus", "text": "Kiinteistöverolain 13 a §:n mukaan kunta voi määrätä yleishyödyllisen yhteisön omistaman, pääasiallisesti yleisessä tai yleishyödyllisessä käytössä olevan rakennuksen ja maapohjan veroprosentin yleistä alemmaksi, myös 0,00:ksi. Verohallinnon mukaan vain harva kunta muutti tätä prosenttia vuonna 2026. Paimion kohteiden verotusarvoja tai laskelmaa alemman prosentin kustannuksesta ei löytynyt.", "sources": [["Kiinteistöverolaki", "https://www.finlex.fi/fi/lainsaadanto/1992/654"], ["Verohallinto: ennakkotietoa 2026", "https://vero.fi/tietoa-verohallinnosta/tilastot/kiinteistoverotilastoj/ennakkotietoa-kiinteistoverotuksesta-2026/"]]}, {"status": "Osittainen vastaus", "text": "Kun kunta käyttää rakentamattoman rakennuspaikan veroprosenttia (Paimiossa 3,00 %), sen on selvitettävä ja ilmoitettava rakennuspaikat Verohallinnolle vuosittain (kiinteistöverolaki 20 a §). Tietoa Paimion ilmoituksen ajantasaisuudesta ei löytynyt; tarkistus kannattaa pyytää kaupungilta.", "sources": [["Verohallinto: rakentamaton rakennuspaikka kiinteistöverotuksessa", "https://vero.fi/syventavat-vero-ohjeet/ohje-hakusivu/341613/"], ["Kiinteistöverolaki", "https://www.finlex.fi/fi/lainsaadanto/1992/654"]]}], "48": [{"status": "Osittainen vastaus", "text": "Paimion osuus yhteisistä kustannuksista on vuosina 2025–2026 ollut 1,85 % (vanhan sopimuksen liite 3: TE- ja KOTO-valtionosuusmaksu 871 341 €). Vuodesta 2027 osuus päivittyy vuosittain väestötietojen perusteella ja toimitetaan kunnille ennen ensimmäistä laskutusta. Paimion talousarviossa Työvoimapalvelut-tulosalueen toimintakate kasvaa 1,954:stä 2,377 milj. euroon (+21,7 %), mutta luku sisältää myös omat lähipalvelut ja työttömyysturvan rahoitusosuuden. Euromääräistä vuoden 2027 maksuosuutta ei löytynyt.", "sources": [["Turku KH 7.10.2024: osuudet valtionosuusmaksuista", "https://ah.turku.fi/kh/2024/1007024p/Images/2333401.pdf"], ["§ 49 liite 3", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-7-43312.PDF"], ["Talousarviokirja · työvoimapalvelut s. 37–39", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43306.PDF"]]}, {"status": "Osittainen vastaus", "text": "Sopimuksen mukaan talousarvion muutosesitykset käsitellään yhteisessä toimielimessä (työllisyysaluelautakunta) ja annetaan jäsenkunnille tiedoksi ennen Turun valtuuston kokousta; päätöksen tekee Turun kaupunginvaltuusto. Paimio vaikuttaa lautakunnan kautta (itäisillä kunnilla kaksi paikkaa) ja sopimuksen neuvotteluvelvollisuuden kautta.", "sources": [["Yhteistoimintasopimus · kohdat 5 ja 9", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-6-43307.PDF"]]}, {"status": "Ei löytynyt", "text": "Sopimuksessa sitoudutaan Turun hallintosäännön toimivaltajärjestelyihin häiriötilanteissa, mutta käytännön vaikutuksia Paimion henkilöstöön ja lähipalveluihin ei kuvattu löydetyissä lähteissä.", "sources": [["Yhteistoimintasopimus", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-6-43307.PDF"]]}, {"status": "Vastaus löytyi", "text": "Asiakohdan taustan mukaan Paimion valtuusto hyväksyi yhteistoimintasopimuksen 27.9.2023 § 62 ja viranomaistehtäväsopimuksen 13.11.2024 § 54. Päätösehdotus kuitenkin kumoaa ”13.11.2024 § 59 kohdalla hyväksymänsä sopimuksen”. Pykälänumero (§ 54 vai § 59) ja kumottava sopimus (yhteistoimintasopimus vai viranomaistehtäväsopimus) on syytä korjata päätökseen.", "sources": [["§ 48 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-6"]]}], "49": [{"status": "Osittainen vastaus", "text": "Vuosina 2025–2026 Paimion osuus on 1,85 % ja Sauvon 0,52 %, yhteensä 2,38 % (Turun KH:n asiakirjan liite). Vuoden 2027 päivitettyjä osuuksia ei ole julkaistu, joten muutosta ei voi laskea.", "sources": [["Turku KH 7.10.2024: osuudet valtionosuusmaksuista", "https://ah.turku.fi/kh/2024/1007024p/Images/2333401.pdf"]]}, {"status": "Vastaus löytyi", "text": "Liitteen 3 mukaan päivittyvät maksuosuudet perustuvat edeltävän vuoden väestötietojen vuosikeskiarvoihin, ja ne toimitetaan kunnille vuosittain ennen ensimmäistä laskutusta. Talousarvion 2027 laatimisvaiheessa lopullisia osuuksia ei siis ole.", "sources": [["§ 49 liite 3", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-7-43312.PDF"]]}, {"status": "Osittainen vastaus", "text": "Kaupunginjohtajan muistion mukaan uravalmennuksen palveluostoista vähennetään 20 000 €, koska vastuukunta antoi luvan tuottaa palvelu itse, ja yhteistoimintaosuuksista 150 000 €. Pääsopimuksen mukaan oma tuotanto ei kuitenkaan poista velvoitetta osallistua yhteishankintaan, joten nettovaikutus Turun laskuun jää epäselväksi.", "sources": [["Kaupunginjohtajakäsittelyn muistio", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43305.PDF"], ["Pääsopimus · hankinnat", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-7-43308.PDF"]]}, {"status": "Ei löytynyt", "text": "Paimion virkasuhteiden ja delegointipäätösten ajantasaisuudesta ei löytynyt julkista tietoa.", "sources": []}, {"status": "Osittainen vastaus", "text": "Liitteen 5 mukaan starttirahaa ei voida myöntää ilman asiakkaan kotikunnan myönteistä lausuntoa. Kuka Paimiossa lausunnon antaa ja millä kriteereillä, ei löytynyt.", "sources": [["§ 49 liite 5", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-7-43320.PDF"]]}, {"status": "Ei löytynyt", "text": "Aikataulun yhteensovittamisesta ei löytynyt tietoa muista lähteistä kuin sopimustekstistä.", "sources": []}], "50": [{"status": "Osittainen vastaus", "text": "Julkisen kauppakirjan mukaan kiinteä hinta on koko osakekannasta 500 000 € ja lisähinta enintään 250 000 €; Paimion 14,62 %:n osuus olisi noin 73 100 € ja enintään noin 36 500 € lisää. Yhtiön kuntalainaa on yhteensä 182 395,58 €; Paimion osuutta lainasta ja kaupan kuluja ei löytynyt. Ostajan konsernin tiedotteen mukaan kaupan arvioidaan vahvistuvan vuoden 2026 loppuun mennessä.", "sources": [["Julkinen kauppakirja", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-8-43325.PDF"], ["Administer-tiedote 4.9.2026", "https://www.sttinfo.fi/tiedote/72292425/administer-konserniin-kuuluva-kuntalaskenta-laajenee-yritysostolla-ostaa-tilikunnan?lang=fi"]]}, {"status": "Osittainen vastaus", "text": "Arvonmääritystä ei löytynyt. Sijoitusanalyytikon (Inderes) mukaan Tilikunnan liikevaihto on noin 3,0 milj. € ja kannattavuus heikko, ja ostaja tavoittelee tehostamista osana Kuntalaskentaa ja Sarastiaa. Kuntaliitto on nostanut esiin, että omistusmuutoksissa kunnan on selvitettävä vaihtoehdot (jääminen, osakkeiden osto/myynti, yhtiön myynti) ja osakkeiden arvo.", "sources": [["Inderes: analyytikkokommentti 7.9.2026", "https://www.inderes.fi/analyst-comments/administer-vahvistaa-julkisen-sektorin-asemaansa-tilikunnan-ostolla"], ["Kuntaliitto: sidosyksikkömuutoksen tilanne 16.6.2026", "https://www.kuntaliitto.fi/sites/default/files/media/file/Sidosyksikk%C3%B6muutoksen%20tilanne%20-%20Webinaari%20kunnille%2016.6.2026.pdf"]]}, {"status": "Osittainen vastaus", "text": "Taustalla on hankintalain sidosyksikkösääntelyn muutos (519/2026): kunnan omistusosuuden on oltava vähintään 10 %, ja pääsääntö alkaa soveltua 1.7.2027. Esityslistan mukaan talous- ja palkkahallinnon palvelut on tarkoitus kilpailuttaa. Siirtymäkauden sopimusehtoja ei löytynyt julkisista lähteistä.", "sources": [["Hankintalain muutos 519/2026", "https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2026/519"], ["Kuntaliitto: sidosyksikkömuutoksen tilanne", "https://www.kuntaliitto.fi/sites/default/files/media/file/Sidosyksikk%C3%B6muutoksen%20tilanne%20-%20Webinaari%20kunnille%2016.6.2026.pdf"]]}, {"status": "Ei löytynyt", "text": "Kauppakirjan kilpailu- ja rekrytointikieltojen soveltamisesta kaupungin omaan toimintaan ei löytynyt tulkintaa julkisista lähteistä. Kiellot ja niiden poikkeukset on kuvattu oppaan § 50:ssä.", "sources": [["Julkinen kauppakirja", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-8-43325.PDF"]]}, {"status": "Osittainen vastaus", "text": "Esityslistan mukaan omistajat ”haluavat osakekaupalla turvata henkilöstön työpaikkojen jatkuvuuden”, eli kyse on kaupan tavoitteesta. Julkisesta aineistosta ei löytynyt sitovaa työpaikkatakuuta. Analyytikon mukaan integraatiossa haetaan tehostamishyötyjä.", "sources": [["§ 50 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-8"], ["Inderes: analyytikkokommentti", "https://www.inderes.fi/analyst-comments/administer-vahvistaa-julkisen-sektorin-asemaansa-tilikunnan-ostolla"]]}, {"status": "Osittainen vastaus", "text": "Esityslistan mukaan kauppakirja on kokonaan nähtävillä luottamushenkilöiden sähköisessä kokousjärjestelmässä. Sitä, ovatko myös viisi alaliitettä siellä, ei voi julkisista lähteistä varmistaa.", "sources": [["§ 50 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-8"]]}], "51": [{"status": "Ei löytynyt", "text": "Hintaa ei löytynyt. Kuntayhtymä on Varsinais-Suomen kiinteistökuntayhtymä, jonka tilinpäätökset 2024 ja 2025 BDO Audiator Oy on tarkastanut. Vertailuksi: muissa kunnissa BDO:n sopimuksiin on sisältynyt esimerkiksi optiokausien 3 %:n hinnankorotus.", "sources": [["Tilintarkastuskertomus 2024 (Naantalin asiakirjat)", "https://naantali.oncloudos.com/kokous/2025763-5-58026.PDF"]]}, {"status": "Osittainen vastaus", "text": "Asiakohdan mukaan tarkastuslautakunta pyysi edellisen sopimuskauden päätyttyä BDO:lta tarjouksen vain tilikauden 2026 tarkastuksesta. Syytä ei mainita, mutta kuntayhtymän purkamista selvitetään samaan aikaan.", "sources": [["§ 51 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-9"]]}, {"status": "Osittainen vastaus", "text": "Kuntalain 122 §:n mukaan vastuullisen tilintarkastajan on oltava JHT-tilintarkastaja, joka toimii virkavastuulla. On yleistä, että tilintarkastusyhteisö hoitaa myös tarkastuslautakunnan sihteerin tehtävän (esim. Parainen, Sasky). Tehtävien rajausta Paimion tapauksessa ei löytynyt.", "sources": [["Kuntalaki", "https://www.finlex.fi/fi/lainsaadanto/2015/410"]]}, {"status": "Ei löytynyt", "text": "Purkulaskelmaa tai aikataulua ei löytynyt. Vertailuksi Pelkosenniemen–Savukosken kiinteistökuntayhtymä on purettu kiinteistöjen tasearvoihin perustuvalla purkusopimuksella.", "sources": [["Pelkosenniemen kunnanhallitus 13.4.2026", "https://paatoksetd10.pelkosenniemi.fi/kokous/2026232-7.PDF"]]}], "52": [{"status": "Osittainen vastaus", "text": "Teknisen lautakunnan mukaan Kriivarin koulun laajennus- ja peruskorjaushanke alitti vuonna 2025 määrärahan reilulla 400 000 eurolla, ja saman suuruinen ylitys on näköpiirissä vuodelle 2026. Syyskuun loppuun mennessä hankkeen kustannuksia oli 2,8 milj. € vuonna 2026. Alkuperäistä ja viimeisintä hyväksyttyä kokonaisbudjettia ei löytynyt.", "sources": [["§ 52 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-10"], ["§ 54 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-12"]]}, {"status": "Osittainen vastaus", "text": "Lautakunnan perustelujen mukaan lisätarve johtuu pääosin jaksotuksesta (noin 400 000 €), ja toteutumattomien hankkeiden noin 80 000 euron varaukset poistetaan; talonrakennuksen lisämäärärahatarve on 470 000 €. Mahdollista kokonaisbudjetin ylitystä ei voi arvioida ilman kokonaisbudjettia.", "sources": [["§ 52 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-10"]]}, {"status": "Ei löytynyt", "text": "Asiakohdan mukaan talousarviomuutoksessa ei ole ennakoitu mahdollisia saatavia Kriivarin putkiurakoitsijan konkurssiin liittyen. Konkurssista ei löytynyt muuta julkista tietoa.", "sources": [["§ 52 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-10"]]}, {"status": "Osittainen vastaus", "text": "§ 54:n mukaan alijäämä voi jäädä alle miljoonan euron, jos toimintakulut pysyvät talousarviossa, tuottoja kertyy riittävästi ja verotilitysten kasvu ei sula. § 52:n muutokset heikentävät tulosta 100 300 €. Lainakannan ennuste vuoden 2026 lopulle on talousarviokirjassa 71,9 milj. €. Yhdistettyä virallista ennustetta ei löytynyt.", "sources": [["§ 54 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-12"], ["Talousarviokirja s. 102", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43306.PDF"]]}], "53": [{"status": "Osittainen vastaus", "text": "Suunnitelmassa jokaisella tavoitteella on toimenpiteet, vastuutaho ja arviointimittarit, mutta ei kustannuksia eikä vuodelle 2027 priorisoituja toimenpiteitä.", "sources": [["Hyvinvointisuunnitelma", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-11-43331.PDF"]]}, {"status": "Osittainen vastaus", "text": "Suunnitelman taulukoissa on arviointimittarit ja tyhjä toteumasarake, mutta lähtöarvoja ja vuoden 2030 tavoitetasoja ei ole. Lähtötiedot ovat laajassa hyvinvointikertomuksessa, joka ei ole tämän kokouksen liitteenä.", "sources": [["Hyvinvointisuunnitelma", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-11-43331.PDF"]]}, {"status": "Vastaus löytyi", "text": "Terveydenhuoltolain 12 §:n mukaan kuntalaisten hyvinvoinnista ja toteutetuista toimenpiteistä on raportoitava valtuustolle vuosittain, ja laaja hyvinvointikertomus laaditaan kerran valtuustokaudessa. Suunnitelman mukaan toimeenpanoa seurataan säännöllisesti osana johtamista.", "sources": [["Terveydenhuoltolaki", "https://www.finlex.fi/fi/lainsaadanto/2010/1326"]]}, {"status": "Ei löytynyt", "text": "Suunnitelmasta ei löytynyt erillistä keinoa pienituloisten, vammaisten tai paljon tukea tarvitsevien osallistumisen turvaamiseen maksujen noustessa.", "sources": []}, {"status": "Osittainen vastaus", "text": "Lastensuojelulain 12 § edellyttää lasten ja nuorten hyvinvointisuunnitelmalta muun muassa tiedot kasvuoloista, hyvinvoinnin tilasta, edistävistä ja ehkäisevistä palveluista ja lastensuojelun voimavaroista. Vanhuspalvelulain 5 § edellyttää ikääntyneen väestön suunnitelmaa, jota arvioidaan valtuustokausittain. Tarkistusta siitä, täyttääkö yhdistetty suunnitelma nämä vaatimukset, ei löytynyt.", "sources": [["Lastensuojelulaki", "https://www.finlex.fi/fi/lainsaadanto/2007/417"], ["Vanhuspalvelulaki", "https://www.finlex.fi/fi/lainsaadanto/2012/980"]]}], "54": [{"status": "Osittainen vastaus", "text": "Raportin mukaan alijäämä voi jäädä alle miljoonan euron, jos ehdot täyttyvät. Kassavarat esitetään heinäkuulta (2,9 milj. €) ja lainat syyskuulta (71,2 milj. €). Koko vuoden kassa- ja velkaennustetta ei raportissa ole; talousarviokirjan ennuste vuoden lopun lainakannasta on 71,9 milj. €.", "sources": [["§ 54 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-12"], ["Talousarviokirja s. 102", "https://julkaisu.paimio.fi/dynasty10/kokous/2026768-3-43306.PDF"]]}, {"status": "Ei löytynyt", "text": "Raportissa ei mainita § 52:n muutoksia eikä avustusten jaksotuksia. Elokuun 2,1 %:n palkankorotukset on mainittu loppuvuoden riskinä.", "sources": [["§ 54 asiakohta", "https://julkaisu.paimio.fi/dynasty10/cgi/DREQUEST.PHP?page=meetingitem&id=2026768-12"]]}, {"status": "Ei löytynyt", "text": "Korjattua raporttia tai syyskuun kassatilannetta ei löytynyt julkisista lähteistä.", "sources": []}], "55": [{"status": "Vastaus löytyi", "text": "Kuntalain 95 §:n mukaan asia, jota ei ole mainittu kokouskutsussa, voidaan ottaa käsiteltäväksi, jos toimielin päättää yksimielisesti, että asia on kiireellinen. Kiireellisyyden perustelu on siksi kirjattava.", "sources": [["Kuntalaki 95 §", "https://www.finlex.fi/fi/lainsaadanto/2015/410"]]}], "56": [{"status": "Osittainen vastaus", "text": "Paimion hallintosääntöä ei löytynyt verkosta haulla. Kuntaliiton hallintosääntömallissa valtuutettujen aloitteet ohjataan kaupunginhallituksen valmisteltaviksi, ja kaupunginhallitus tuo vuosittain valtuustolle luettelon aloitteista ja niiden johdosta tehdyistä toimenpiteistä. Paimion käytäntö kannattaa varmistaa omasta hallintosäännöstä.", "sources": [["Kuntaliitto: kunnan hallintosääntömalli", "https://julkaisut.kuntaliitto.fi/2239"]]}]};
const ansBadge=s=>`<span class="badge ${s==='Vastaus löytyi'?'ok':s==='Ei löytynyt'?'risk':'warn'}">${escape(s)}</span>`;
const answerHtml=a=>a?`<div class="answer"><strong class="small">Mitä löytyi:</strong> ${ansBadge(a.status)}<p>${escape(a.text)}</p>${(a.sources||[]).length?`<div class="sources">${a.sources.map(([n,u])=>link(n,u)).join('')}</div>`:''}</div>`:'';
function renderNav(){const shown=items.filter(matches);el('agenda').innerHTML=shown.length?shown.map(i=>`<button class="nav-item" data-item="${i.n}" aria-current="${view==='item'&&selected===i.n}"><span class="num">§ ${i.n}</span><span class="navtext">${escape(i.short)}</span>${i.critical?'<span class="dot" aria-hidden="true"></span><span class="sr">, kaipaa tarkennusta</span>':''}</button>`).join(''):'<p class="empty">Ei hakutuloksia.</p>';el('mobile-nav').innerHTML='<option value="">Siirry asiaan…</option>'+shown.map(i=>`<option value="${i.n}" ${view==='item'&&selected===i.n?'selected':''}>§ ${i.n} · ${escape(i.short)}</option>`).join('');}
function overview(){return `<div class="intro"><div class="eyebrow">Kokouksen tilannekuva</div><h2 style="margin-top:10px">Suunta paranee.<br>Tasapaino on vielä herkkä.</h2><p class="lead">Velka vähenee investointien hiljentyessä. Samalla palveluista säästetään, työllisyysmenot kasvavat ja korjauksia siirtyy tulevaisuuteen.</p><p class="sub">Avaa vasemmalta yksittäinen asia tai aloita alla olevista nostoista. Jokaisessa asiassa näet ensin nykytilanteen, ehdotuksen ja muutoksen. Faktat, oma arvio ja nousseet kysymykset on erotettu toisistaan.</p></div><section class="ai-note" aria-labelledby="ai-note-h"><h3 id="ai-note-h">Tekoälyn kokoama opas</h3><p>Opas on koottu tekoälyavustajan avulla kaupungin julkaisemasta esityslistasta ja liitteistä. Tekoäly voi lukea asiakirjan väärin, laskea virheellisesti tai jättää jotain olennaista huomaamatta. Tilannearviot ja kysymykset ovat tekijän näkemyksiä, eivät kaupungin kantoja.</p><p>Tarkista päätöksen kannalta tärkeät luvut ja tiedot alkuperäisistä asiakirjoista, joihin opas linkittää. Jos huomaat virheen tai puutteen, ilmoita siitä: oppaan saa korjata ja täydentää.</p><p>Nousseiden kysymysten alle on 9.11.2026 haettu verkosta mahdollisia vastauksia (”Mitä löytyi”). Ne ovat tekoälyn kokoamia ja lähteistettyjä, mutta eivät kaupungin virallisia vastauksia.</p><p>Korjaukset ja huomiot: <a href="mailto:oskari@summanen.org?subject=Valtuusto-opas%2011.11.2026%3A%20korjaus">oskari@summanen.org</a> tai <a href="https://github.com/suomainen/valtuusto-opas/issues" target="_blank" rel="noopener noreferrer">GitHubissa <span aria-hidden="true">↗</span><span class="sr"> (avautuu uuteen välilehteen)</span></a>.</p></section><div class="stats"><div class="stat"><span class="small">2027 · esitetty alijäämä</span><span class="value">−0,77 milj. €</span><p class="small">TA2026: −1,31 milj. € → 2027: −0,77 milj. €. Alijäämä pienenee noin 0,54 milj. €.</p></div><div class="stat"><span class="small">2027 · lainakannan muutos</span><span class="value">−2,19 milj. €</span><p class="small">2026 ennuste: velka +3,31 milj. € → 2027: −2,19 milj. €. Lainakanta 71,93 → 69,74 milj. €.</p></div><div class="stat"><span class="small">Kauden ulkopuoliset hanketarpeet</span><span class="value">25,9 milj. €</span><p class="small">Nykyinen karkea tarvearvio, ei vuosimeno. Aiempi vertailukelpoinen kokonaissumma puuttuu.</p></div></div><div class="sources">${link('Talousarviokirja',budget)}${link('Koko esityslista',meeting)}</div><div class="note"><strong>Mitä ”nyt” tarkoittaa?</strong> TA2026 = nykyinen talousarvio, EN2026 = ennuste, toteuma = toteutunut rajattu ajanjakso. § 52:ssa verrataan saman vuoden vanhaa ja ehdotettua uutta budjettia. Vertailun ajankohta on aina merkitty; puuttuvaa lähtölukua ei ole arvioitu.</div><section class="section"><h3>Neljä nostoa esityslistalta</h3><div class="priority-grid">${[[45,'Talous ja palvelujen arki','Mitä säästöt käytännössä muuttavat ja mitkä korjaukset voidaan turvallisesti siirtää?'],[49,'Työllisyyden kustannusvastuu','Uusi jakomalli alkaa 2027. Paimion kustannusvaikutus on vielä avoin.'],[50,'Tilikunnan kauppa','Myyntihinta on vain osa kokonaisuutta. Tuleva palveluhinta, siirtymä ja vastuut ratkaisevat.'],[53,'Hyvinvointisuunnitelman toteutus','Miten tavoitteet toteutuvat henkilöstön vähentyessä ja maksujen noustessa?']].map(([n,t,p])=>`<button class="priority" data-item="${n}"><span class="badge">§ ${n}</span><strong>${t} <span aria-hidden="true">→</span></strong><p>${p}</p></button>`).join('')}</div></section><div class="note warn"><strong>Päätöksentekoa tukevat tarkennukset</strong><br>Talouslaskelmien yhtenäisyys, työllisyyssopimusten vaikutukset Paimiolle ja Tilikunnan täydet sopimusasiakirjat. <button class="jump" data-view="sources">Avaa tarkennuskohdat <span aria-hidden="true">→</span></button></div><section class="section"><h3>Mitä on tarkistettu?</h3><p class="small">Kaikki 14 asiaa (§ 43–56), 19 julkisesti linkitettyä liite- ja oheismateriaali-PDF:ää, yhteensä 223 liitesivua. Tarkastelu 8.11.2026 saatavilla olleesta aineistosta. Kokouksen päätöksiä ei ole vielä tehty.</p></section>`;}
function extras(i){if(i.extra==='budget')return `${budgetComparisons()}<details><summary>Talousluvut 2027–2029</summary>${table(['Erä','TA2026*','2027','2028','2029'],[['Toimintakate, milj. €','−35,840','−36,117','−36,515','−37,278'],['Verotulot, milj. €','26,900','28,365','29,300','30,400'],['Valtionosuudet, milj. €','11,276','10,897','10,897','10,897'],['Vuosikate, milj. €','2,100','3,039','3,574','noin 3,811'],['Poistot, milj. €','3,494','3,890','3,890','3,890'],['Yli-/alijäämä, 1 000 €','−1 310','−767','−232','noin +5'],['Nettoinvestoinnit, milj. €','4,184','0,878','1,716','1,346'],['Velan muutos, milj. €','+3,313 (EN)','−2,187','−2,123','−2,623'],['Velka 31.12., milj. €','71,925 (EN)','69,738','67,615','64,992']],'financial')}<p class="small" style="margin-top:12px">* TA2026 sisältää muutokset 23.9.2026 asti, ei § 52:n ehdotuksia. EN = vuoden 2026 ennuste. Pyöristetyt luvut kirjan s. 15–20 ja 102. Vuoden 2029 yhteenvedoissa on myös pientä lukuvaihtelua.</p></details><details><summary>Palvelu- ja henkilöstömuutokset · 9 kokonaisuutta</summary>${table(['Kokonaisuus','Asiakirjoissa esitetty muutos'],sectors)}<p class="small" style="margin-top:12px">Lähde: talousarviokirjan s. 28–88.</p></details><p style="margin:18px 0 4px"><button class="jump" data-view="investments">Investoinnit hankkeittain ja suunnittelukauden ulkopuoliset hankkeet <span aria-hidden="true">→</span></button></p><details><summary>Siirretyt investoinnit ja konsernin riskit</summary><p>Siirrettyä talonrakentamista on 14,4 milj. €: lukion A-osa, Kriivarin päiväkoti, Hanhijoen koulu ja päiväkoti, Vistan puukoulu sekä sisäliikuntahallin varavoima. Muissa tarpeissa on muun muassa 5 milj. € Turuntien silta. Kokonaistarve on 25,905 milj. € (s. 99).</p><p>Yrityskiinteistöjen yksi vuokralainen, Palvelukeskussäätiön velkavipu, Lämpökeskuksen vanheneva kattila ja Vesihuollon saneeraustarpeet edellyttävät konsernin yhteistä rahoitusarviota (s. 103–111).</p></details><details><summary>Oikeudellinen huomio · alijäämä ja kertynyt ylijäämä</summary><p>Muistion ilmaisu tasapainon puutteesta ei yksin osoita lainvastaisuutta. Kuntalain 110 § sallii laadintavuoden lopulle arvioidun kertyneen ylijäämän huomioon ottamisen. Vuoden 2025 kertynyttä ylijäämää on esittelyn mukaan 13,7 milj. €. Tarvitaan laskelma sen kehityksestä suunnitelmakaudella.</p>${link('Kuntalaki 110 §',laws)}</details><details><summary>Lukujen ja perustelujen tarkennukset</summary>${list(issues.filter(x=>x.n===45).map(x=>x.text))}</details><details><summary>Varhaiskasvatuksen poissaolomaksut</summary><p>Kaupunginjohtajakäsittelyn muistiossa ehdotetaan ilmoittamattomien poissaolojen ”sakkomaksujen” käyttöönottoa. Ennen toteutusta on yksilöitävä maksun lainmukainen peruste, soveltamistilanteet ja päätöksentekijä. Asiakasmaksulain 10 § koskee tiettyjä peruuttamatta jätettyjä tilanteita; muistion yleinen ilmaisu ei yksin ratkaise maksun sallittua laajuutta.</p>${link('Asiakasmaksulaki 9–10 §','https://www.finlex.fi/fi/lainsaadanto/2016/1503')}</details>`;
if(i.extra==='tax')return '';
if(i.extra==='attachments')return '<div class="section"><h4>Kaikki kahdeksan sopimusliitettä</h4>'+attachments.map(([title,id,desc])=>`<details><summary>${title}</summary><p>${desc}</p>${link('Avaa alkuperäinen liite',pdf(id))}</details>`).join('')+'</div>';
if(i.extra==='changes')return '';return '';}
function item(){const i=items.find(x=>x.n===selected);return `<div class="item-head"><div><div class="tagrow"><span class="badge">§ ${i.n}</span><span class="badge">${i.tag}</span>${i.critical?'<span class="badge warn">Kaipaa tarkennusta</span>':''}</div><h2>${escape(i.title)}</h2></div></div><div class="legend"><span><b>Todettu</b> = asiakirjan tieto</span><span><b>Arvio</b> = oma johtopäätös</span></div>${comparison(i)}<section class="block"><h3 class="block-label">01 / Todettu ja päätösehdotus</h3>${list(i.facts)}${extras(i)}</section><section class="block"><h3 class="block-label assess">02 / Oma tilannearvio</h3><p>${escape(i.assessment)}</p></section>${i.risks.length?`<section class="block"><h3 class="block-label risks">03 / Huomioitavaa ja avoimia kohtia</h3>${list(i.risks)}</section>`:''}<section class="block"><h3 class="block-label">04 / Nousseet kysymykset</h3>${questionsFor(i)}</section><section class="block"><h3>Alkuperäiset lähteet</h3><div class="sources">${link('Asian esittely ja ehdotus',itemUrl(i.n))}${i.sources.map(([n,u])=>link(n,u)).join('')}</div></section><div class="pager"><button class="btn" data-item="${Math.max(43,i.n-1)}" ${i.n===43?'disabled':''}><span aria-hidden="true">←</span> Edellinen</button><span class="small">${i.n-42} / 14</span><button class="btn" data-item="${Math.min(56,i.n+1)}" ${i.n===56?'disabled':''}>Seuraava <span aria-hidden="true">→</span></button></div>`;}
function questionsFor(i){return '<ul class="q-list">'+i.questions.map((q,k)=>{let id=i.n+'-'+k;return `<li><label><input type="checkbox" data-question="${id}" ${checked.has(id)?'checked':''}><span>${escape(q)}</span></label>${answerHtml((ANSWERS[i.n]||[])[k])}</li>`;}).join('')+'</ul>';}
function questions(){const found=items.filter(matches);const total=items.reduce((s,i)=>s+i.questions.length,0);return `<div class="eyebrow">Oma kokouslista</div><h2 style="margin-top:10px">Nousseet kysymykset</h2><p class="sub">Kysymysten alla on verkosta 9.11.2026 haettu tieto lähteineen ja merkintä siitä, löytyikö vastaus. Merkitse käsitelty kysymys rastilla. Merkinnät säilyvät tämän sivuistunnon aikana. Haku rajaa asioita myös tässä näkymässä.</p><div class="q-toolbar"><span class="small" id="qcount">${checked.size} / ${total} kysymystä käsitelty</span><button class="btn" id="reset-questions">Tyhjennä rastit</button></div>${found.map(i=>`<details ${i.critical?'open':''}><summary>§ ${i.n} · ${escape(i.short)} <span class="small">(${i.questions.length})</span></summary>${questionsFor(i)}<button class="jump" data-item="${i.n}">Lue asian tausta <span aria-hidden="true">→</span></button></details>`).join('')||'<p class="empty">Ei hakutuloksia.</p>'}`;}
function sources(){return `<div class="eyebrow">Aineiston tarkistus</div><h2 style="margin-top:10px">Aineiston tarkennuskohdat</h2><p class="sub">Tähän on koottu tarkennusta kaipaavat tiedot, puuttuvat liitteet ja kohdat, joiden julkisuutta on rajattu.</p><div class="q-toolbar"><span class="small">${issues.length} tarkistuskokonaisuutta</span><button class="btn" id="copy-issues">Kopioi tarkistuslista</button></div>${issues.map(i=>`<div class="issue"><span class="badge warn">${escape(i.type)}</span><strong>§ ${i.n} · ${escape(i.title)}</strong><p>${escape(i.text)}</p><button class="jump" data-item="${i.n}">Avaa asia <span aria-hidden="true">→</span></button></div>`).join('')}<section class="section"><h3>Kaikki 19 julkista liite-PDF:ää</h3><p class="small">Lisäksi luettiin 31-sivuinen esityslista ja kaikki 14 verkossa julkaistua asiakohtaa. Puuttuva tilintarkastussopimus ei sisälly alla olevaan luetteloon.</p><div class="all-source-list">${allPdfSources().map(([n,u])=>link(n,u,'')).join('')}</div></section><section class="section"><h3>Muut lähteet</h3><div class="sources">${link('Kokouksen esityslista',meeting)}${link('Kuntalaki',laws)}${link('Hankintalain muutos 519/2026','https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2026/519')}${link('Verotusmenettelylaki','https://www.finlex.fi/fi/lainsaadanto/1995/1558')}${link('Varhaiskasvatuksen asiakasmaksut','https://www.finlex.fi/fi/lainsaadanto/2016/1503')}</div></section>`;}
function allPdfSources(){return [['§ 45 · Kaupunginjohtajakäsittelyn muistio',memo],['§ 45 · Talousarvio 2027 ja taloussuunnitelma',budget],['§ 48 · Yhteistoimintasopimus',pdf('2026768-6-43307')],['§ 49 · Viranomaistehtävien pääsopimus',pdf('2026768-7-43308')],...attachments.map(([n,id])=>['§ 49 · '+n,pdf(id)]),['§ 50 · Julkinen osakekauppakirja',pdf('2026768-8-43325')],['§ 52 · Talousarvion 2026 muutokset',pdf('2026768-10-43330')],['§ 53 · Hyvinvointisuunnitelma',pdf('2026768-11-43331')],...items.find(i=>i.n===54).sources.map(([n,u])=>['§ 54 · '+n,u])];}
function render(){renderNav();document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===view));document.querySelectorAll('.tab').forEach(t=>t.tabIndex=t.dataset.view===view?0:-1);setTitle();el('panel').setAttribute('aria-labelledby','tab-'+view);el('panel').innerHTML=({overview,item,investments,residents,questions,sources})[view]()+`<footer>Valtuutetun valmistautumisaineisto, koottu tekoälyn avulla: tarkista olennaiset tiedot alkuperäisistä asiakirjoista ja ilmoita virheistä osoitteeseen <a href="mailto:oskari@summanen.org?subject=Valtuusto-opas%2011.11.2026%3A%20korjaus">oskari@summanen.org</a> · Lähdeaineisto 8.11.2026, vertailut täydennetty 9.11.2026 · Asiakirjoihin perustuvat tiedot ja omat arviot on erotettu. Kokouksen päätöksiä ei vielä ole. Julkaistut lähteet avautuvat uuteen välilehteen. <a href="../index.html">Kaikki kokousoppaat</a></footer>`;if(view==='residents')residentCalc();}
function navigate(v,n){view=v;if(n)selected=Number(n);render();if(v==='item')history.replaceState(null,'','#asia-'+selected);else history.replaceState(null,'','#'+v);window.scrollTo({top:0,behavior:'instant'});el('panel').focus({preventScroll:true});}
document.addEventListener('click',async e=>{const itemButton=e.target.closest('[data-item]');if(itemButton){navigate('item',itemButton.dataset.item);return;}const viewButton=e.target.closest('[data-view]');if(viewButton){navigate(viewButton.dataset.view);return;}if(e.target.id==='print'){document.querySelectorAll('#panel details').forEach(d=>d.open=true);window.print();}if(e.target.id==='reset-questions'){checked.clear();render();}if(e.target.id==='copy-issues'){const text=issues.map(i=>`§ ${i.n} — ${i.title}\n${i.text}`).join('\n\n');try{await navigator.clipboard.writeText(text);notify('Tarkistuslista kopioitu.');}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();notify(ok?'Tarkistuslista kopioitu.':'Kopiointi ei onnistunut tässä selaimessa.');}}});
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('[data-calc]'))residentCalc();});
document.addEventListener('change',e=>{if(e.target.dataset.question){const id=e.target.dataset.question;e.target.checked?checked.add(id):checked.delete(id);document.querySelectorAll(`[data-question="${id}"]`).forEach(x=>x.checked=e.target.checked);if(el('qcount'))el('qcount').textContent=checked.size+' / '+items.reduce((s,i)=>s+i.questions.length,0)+' kysymystä käsitelty';}});
el('search').addEventListener('input',e=>{query=e.target.value.trim().toLocaleLowerCase('fi');if(query&&view!=='questions')view='questions';render();announce(query?items.filter(matches).length+' asiaa vastaa hakua':'Haku tyhjennetty, kaikki asiat näkyvissä');});el('mobile-nav').addEventListener('change',e=>{if(e.target.value)navigate('item',e.target.value);});
document.querySelector('[role=tablist]').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;const tabs=[...document.querySelectorAll('.tab:not([hidden])')];let k=tabs.indexOf(document.activeElement);if(k<0)return;e.preventDefault();k=e.key==='Home'?0:e.key==='End'?tabs.length-1:(k+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[k].focus();navigate(tabs[k].dataset.view);tabs[k].focus();});

const baseTitle=document.title;
function setTitle(){const cur=items.find(x=>x.n===selected);const names={overview:'Tilannekuva',investments:'Investoinnit',residents:'Asukas ja talous',questions:'Nousseet kysymykset',sources:'Tarkennukset ja lähteet'};document.title=(view==='item'&&cur?'§ '+cur.n+' '+cur.title:names[view])+' · '+baseTitle;}
function announce(t){el('live').textContent='';setTimeout(()=>el('live').textContent=t,50);}
function notify(t){el('toast').textContent=t;announce(t);setTimeout(()=>el('toast').textContent='',2500);}
const hash=location.hash.slice(1);if(/^asia-(4[3-9]|5[0-6])$/.test(hash)){view='item';selected=Number(hash.slice(5));}else if(['overview','investments','residents','questions','sources'].includes(hash))view=hash;
render();
})();
</script>
</body>
</html>
